name: Capture real app screens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"

permissions:
  contents: write

concurrency:
  group: usa-app-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter screenshot version
        run: |
          flutter pub get
          flutter build web --release --base-href "/" -t tool/screenshot_harness.dart

      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright http-server
          npx playwright install --with-deps chromium

      - name: Capture the real Flutter screens
        run: |
          mkdir -p docs/screenshots
          npx http-server build/web -p 4173 -c-1 > /tmp/usa-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          const BASE = 'http://127.0.0.1:4173/?screen=';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              reducedMotion: 'reduce'
            });

            const capture = async (screen, filename) => {
              const page = await context.newPage();
              await page.goto(BASE + screen, { waitUntil: 'networkidle' });
              await wait(3200);
              await page.screenshot({
                path: `docs/screenshots/${filename}.png`,
                fullPage: false,
                animations: 'disabled'
              });
              console.log('Captured 430x932 screen:', screen, '->', filename);
              await page.close();
            };

          await capture('welcome', '01-accueil');
          await capture('west', '02-ouest-americain');
          await capture('east', '03-est-americain');
          await capture('west-0', '04-grand-canyon');
          await capture('west-1', '05-monument-valley');
          await capture('west-2', '06-yellowstone');
          await capture('west-3', '07-death-valley');
          await capture('west-4', '08-antelope-canyon');
          await capture('west-5', '09-canyonlands');
          await capture('west-6', '10-bryce-canyon');
          await capture('west-7', '11-zion');
          await capture('west-8', '12-lac-powell');
          await capture('west-9', '13-vague-petrifiee');
          await capture('west-10', '14-dunes-peintes');
          await capture('west-11', '15-lac-mono');
          await capture('west-12', '16-fly-ranch-geyser');
          await capture('niagara', '17-chutes-niagara');
          await capture('smoky', '18-great-smoky-mountains');
          await capture('shenandoah', '19-shenandoah');
          await capture('voyageurs', '20-voyageurs-national-park');

            await context.close();
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify all screenshots exist and are distinct
        run: |
          expected=(
            01-accueil
            02-ouest-americain
            03-est-americain
            04-grand-canyon
            05-monument-valley
            06-yellowstone
            07-death-valley
            08-antelope-canyon
            09-canyonlands
            10-bryce-canyon
            11-zion
            12-lac-powell
            13-vague-petrifiee
            14-dunes-peintes
            15-lac-mono
            16-fly-ranch-geyser
            17-chutes-niagara
            18-great-smoky-mountains
            19-shenandoah
            20-voyageurs-national-park
          )
          for name in "${expected[@]}"; do
            test -s "docs/screenshots/$name.png" || {
              echo "Missing screenshot: $name.png"
              exit 1
            }
          done

          declare -A hashes
          for name in "${expected[@]}"; do
            hash=$(sha256sum "docs/screenshots/$name.png" | cut -d ' ' -f 1)
            if [[ -n "${hashes[$hash]:-}" ]]; then
              echo "Duplicate screenshot: $name.png matches ${hashes[$hash]}.png"
              exit 1
            fi
            hashes[$hash]="$name"
          done

          echo "Verified ${#expected[@]} distinct mobile screenshots (430x932)."
          ls -lh docs/screenshots/*.png

      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh real Flutter app screenshots"
          file_pattern: "docs/screenshots/*.png"
